<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Life – Simulation de carrière</title>
<style>
:root{--bg:#0b1a12;--card:#12281c;--card2:#183524;--line:#25503a;--txt:#eaf6ee;--mut:#8fb5a0;--acc:#2ee37a;--gold:#f5c542;--red:#ff6b6b;--blue:#4cc3ff}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at top,#14402a 0,#0b1a12 55%) fixed;color:var(--txt);min-height:100vh;line-height:1.5}
.wrap{max-width:1050px;margin:0 auto;padding:20px 16px 60px}
.top{text-align:center;margin-bottom:22px}
.top h1{font-size:2.2rem;letter-spacing:.5px}
.top .sub{color:var(--mut)}
h2{margin-bottom:8px}
h3{margin:16px 0 8px;color:var(--mut);font-size:.95rem;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px;margin-top:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.2s}
.pcard:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 8px 24px rgba(46,227,122,.15)}
.pcard .fl{font-size:2.4rem}
.pcard h4{margin:6px 0 2px;font-size:1.1rem}
.pcard small{color:var(--mut);display:block}
.pcard .pt{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.hud{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.id{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.id .flag{font-size:3rem}
.id p{color:var(--mut);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}
.stat.big b{display:block;font-size:1.15rem;margin-top:2px}
.stat.big span,.sl span{color:var(--mut);font-size:.8rem}
.sl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bar{height:8px;background:#0b1a12;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
.layout{display:grid;grid-template-columns:1fr 280px;gap:16px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.tag{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.8rem;margin-bottom:10px;color:var(--acc)}
.txt{font-size:1.05rem;margin:8px 0 16px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;font-size:1rem;cursor:pointer;transition:.15s}
.choice:hover{border-color:var(--acc);background:#1d4430;transform:translateX(4px)}
.btn{background:var(--acc);color:#04210f;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:1rem;cursor:pointer;margin:4px 6px 4px 0}
.btn:hover{filter:brightness(1.1)}
.btn.small{padding:8px 14px;font-size:.9rem}
.btn.alt{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border-radius:99px;padding:4px 12px;font-size:.88rem;font-weight:600;background:var(--card2)}
.chip.up{color:var(--acc);border:1px solid var(--acc)}
.chip.down{color:var(--red);border:1px solid var(--red)}
.offers{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.offer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.offer small{color:var(--mut)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.opt{background:var(--card2);color:var(--txt);border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.opt.sel{border-color:var(--gold);background:#2a3a1c}
.opt small{color:var(--mut)}
table{width:100%;border-collapse:collapse;margin:10px 0 16px}
td{padding:7px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:600}
#log{list-style:none;font-size:.88rem;color:var(--mut)}
#log li{padding:7px 0;border-bottom:1px solid var(--line)}
.big-title{font-size:1.8rem;color:var(--gold);margin:6px 0}
/* Match */
.board{display:flex;align-items:center;justify-content:space-around;gap:10px;background:linear-gradient(135deg,#0e3b22,#14522f);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;text-align:center}
.board span{font-size:2rem;display:block}
.board small{color:var(--mut);display:block;font-size:.85rem}
.board .sc{font-size:2.2rem;font-weight:800;color:var(--gold);letter-spacing:2px}
.mstat{color:var(--mut);font-size:.9rem;margin-bottom:12px;text-align:center}
.ln{padding:8px 12px;margin-bottom:8px;border-left:3px solid var(--line);background:var(--card2);border-radius:0 10px 10px 0}
.ln.goal{border-left-color:var(--acc)}
.ln.bad{border-left-color:var(--red)}
.ln.sys{border-left-color:var(--gold)}
</style>
</head>

function fmt(n){const s=n<0?"-":"";n=Math.abs(n);

/* ============ ÉTAT ============ */
let G=null,NEGO=null,M=null;

function salaryFor(ovr,club){
  const base=20000*Math.exp((ovr-40)*0.15);
  const lf=clamp(0.85+(club.l-60)/80,0.8,1.4);
  return Math.round(base*lf*(club.m||1)*(0.9+G.rep/500)/1000)*1000;
}
function snap(){return{ovr:Math.round(G.ovr),form:Math.round(G.form),rep:Math.round(G.rep),couple:Math.round(G.couple),fam:Math.round(G.fam),money:G.money,partner:!!G.partner}}
function addLog(m){G.log.push(`S${G.season} · ${m}`);if(G.log.length>40)G.log.shift()}
function setMain(h){$("#main").innerHTML=h;window.scrollTo({top:0,behavior:"smooth"})}
function saveGame(){try{localStorage.setItem("fl_save",JSON.stringify(G))}catch(e){}}

function chips(b,a){
  const L={ovr:"Niveau",form:"Forme",rep:"Réputation",couple:"Couple",fam:"Famille",money:"Argent"};
  let h="";
  for(const k in L){
    if(k==="couple"&&!b.partner&&!a.partner)continue;
    const d=a[k]-b[k];if(!d)continue;
    const txt=k==="money"?(d>0?"+":"")+fmt(d):(d>0?"+":"")+d;
    h+=`<span class="chip ${d>0?"up":"down"}">${L[k]} ${txt}</span>`;
  }
  return h||`<span class="chip">Aucun changement</span>`;
}

function applyFx(fx){
  if(fx.sal)G.money+=fx.sal*G.salary;
  if(fx.money)G.money+=fx.money;
  if(fx.partner){if(!G.partner)G.couple=20;G.partner=fx.partner}
  if(fx.kids)G.kids+=fx.kids;
  ["form","rep","fam"].forEach(k=>{if(fx[k])G[k]=clamp(G[k]+fx[k])});
  if(fx.couple&&G.partner)G.couple=clamp(G.couple+fx.couple);
  if(fx.ovr)G.ovr=clamp(G.ovr+fx.ovr,40,99);
  if(fx.natMatch)G.queue.unshift("natmatch");
}

/* ============ AFFICHAGE ============ */
function bar(l,v,col){return `<div class="stat"><div class="sl"><span>${l}</span><b>${Math.round(v)}</b></div><div class="bar"><i style="width:${v}%;background:${col}"></i></div></div>`}
function render(){
  $("#hud").innerHTML=`
  <div class="id"><div class="flag">${G.flag}</div><div><h2>${G.name}</h2>
  <p>${POS[G.pos]} · ${G.nat} · ${G.age} ans · Saison ${G.season}</p><p>${G.club.f} ${G.club.n} · Sélection : ${G.natTeam}</p></div></div>
  <div class="stats">
    <div class="stat big"><span>Niveau</span><b>${Math.round(G.ovr)}</b></div>
    ${bar("Forme",G.form,"var(--blue)")}
    ${bar("Réputation",G.rep,"var(--gold)")}
    ${G.partner?bar(G.partner==="marié"?"Mariage":"Couple",G.couple,"#ff7ab0"):`<div class="stat"><div class="sl"><span>Couple</span><b>Célibataire</b></div></div>`}
    ${bar("Famille"+(G.kids?` (${G.kids} 👶)`:""),G.fam,"var(--acc)")}
    <div class="stat big"><span>Argent</span><b>${fmt(G.money)}</b></div>
    <div class="stat big"><span>Salaire / an</span><b>${fmt(G.salary)}</b></div>
    <div class="stat big"><span>Palmarès</span><b>🏆 ${G.trophies} · 🥇 ${G.ballons}</b></div>
  </div>`;
  $("#log").innerHTML=G.log.slice(-8).reverse().map(x=>`<li>${x}</li>`).join("");
}

function showResult(msg,ch,cb,btn="Continuer"){
  setMain(`<p class="txt">${msg}</p><div class="chips">${ch}</div><button class="btn" id="go">${btn}</button>`);
  $("#go").onclick=cb;render();
}

/* ============ DÉMARRAGE ============ */
function buildStart(){
  $("#players").innerHTML=PLAYERS.map((p,i)=>`
   <div class="pcard" onclick="newGame(${i})">
     <div class="fl">${p.flag}</div><h4>${p.name}</h4><small>${p.nat} · ${p.age} ans</small>
     <div class="pt"><span class="pill">${POS[p.pos]}</span><span class="pill">Niveau ${p.ovr}</span><span class="pill">Potentiel ${p.pot}</span></div>
     <small>${p.bio}</small><small style="margin-top:6px">${p.club.f} ${p.club.n}</small>
     <small>Sélection : ${p.natTeam||p.nat}</small>
   </div>`).join("");
  let saved=null;try{saved=JSON.parse(localStorage.getItem("fl_save"))}catch(e){}
  if(saved){
    $("#resume").innerHTML=`<button class="btn alt" onclick="loadGame()">▶ Reprendre : ${saved.name} (Saison ${saved.season})</button>`;
  }
}
function newGame(i){
  const P=PLAYERS[i];
  G={name:P.name,nat:P.nat,natTeam:P.natTeam||P.nat,flag:P.flag,pos:P.pos,age:P.age,ovr:P.ovr,pot:P.pot,club:P.club,
     form:75,rep:12,couple:0,fam:70,partner:null,kids:0,money:15000,salary:0,season:1,
     trophies:0,ballons:0,peak:P.ovr,seen:[],queue:[],log:[],hist:[],summit:false,offers:[],
     sGoals:0,sAssists:0,sWins:0,sLosses:0,cupWon:false};
  G.salary=salaryFor(G.ovr,G.club);
  $("#start").hidden=true;$("#game").hidden=false;
  addLog(`Tu débutes ta carrière à ${G.club.n}.`);
  beginSeason();
}
function loadGame(){
  try{G=JSON.parse(localStorage.getItem("fl_save"))}catch(e){return}
  G.natTeam=G.natTeam||G.nat;G.sGoals=G.sGoals||0;G.sAssists=G.sAssists||0;
  G.sWins=G.sWins||0;G.sLosses=G.sLosses||0;G.cupWon=!!G.cupWon;
  $("#start").hidden=true;$("#game").hidden=false;
  addLog("Partie reprise.");beginSeason();
}

/* ============ SAISON ============ */
function beginSeason(){
  saveGame();
  let elig=EVENTS.filter(e=>(!e.cond||e.cond(G))&&!G.seen.includes(e.id));
  if(elig.length<3){G.seen=[];elig=EVENTS.filter(e=>!e.cond||e.cond(G))}
  const evs=shuffle(elig).slice(0,3).map(e=>e.id);
  G.queue=[evs[0],"match","transfer",evs[1],"bigmatch",evs[2]];
  render();nextStep();
}
function nextStep(){
  if(!G.queue.length)return endSeason();
  const s=G.queue.shift();
  if(s==="transfer")return transferWindow();
  if(s==="match"||s==="bigmatch"||s==="natmatch")return startMatch(s);
  showEvent(s);
}
function proceed(){
  if(G.form<=0)return finish("blessure");
  if(G.money<-2e6)return finish("ruine");
  nextStep();
}
function showEvent(id){
  const ev=EVENTS.find(e=>e.id===id);
  if(ev.cond&&!ev.cond(G))return nextStep();
  G.seen.push(id);if(G.seen.length>10)G.seen.shift();
  let h=`<span class="tag">${CATS[ev.cat]}</span><h2>Saison ${G.season} · ${G.age} ans</h2><p class="txt">${ev.t(G)}</p><div class="choices">`;
  ev.ch.forEach((c,i)=>{h+=`<button class="choice" data-i="${i}">${c.t}</button>`});
  h+="</div>";setMain(h);
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>resolve(ev.ch[b.dataset.i]));
}
function resolve(c){
  let r=c.ok;
  if(c.p!==undefined)r=Math.random()<c.p?c.ok:c.ko;
  const b=snap();applyFx(r.fx);const a=snap();
  addLog(r.msg);
  showResult(r.msg,chips(b,a),proceed);
}

/* ============ MATCHS INTERACTIFS ============ */

const pf=()=>(G.form-60)/300;

function pickType(i){
  if(i===0)return"attaque";
  if(i===5)return Math.random()<.5?"attaque":"contre";
  const pool=["attaque","contre","coupfranc","defense","penalty"].filter(t=>!(["penalty","coupfranc"].includes(t)&&M.used.includes(t)));
  return pool[Math.floor(Math.random()*pool.length)];
}

function startMatch(kind){
  const nat=kind==="natmatch",big=kind==="bigmatch";
  let myN,myF,myL,opN,opF,opL,title;
  if(nat){
    myN=G.natTeam;myF=G.flag;myL=72+Math.round(clamp((G.ovr-60)/6,0,6));
    const o=NATS[Math.floor(Math.random()*NATS.length)];opN=o.n;opF=o.f;opL=ri(68,86);
    title="Match international";
  }else{
    myN=G.club.n;myF=G.club.f;myL=G.club.l;
    const tgt=G.club.l+(big?ri(2,8):ri(-6,4));
    const o=shuffle(CLUBS.filter(c=>c.n!==G.club.n).sort((a,b)=>Math.abs(a.l-tgt)-Math.abs(b.l-tgt)).slice(0,5))[0];
    opN=o.n;opF=o.f;opL=o.l;
    title=big?"Finale de coupe nationale":"Match de championnat";
  }
  M={kind,big,nat,title,myN,myF,myL,opN,opF,opL,my:0,op:0,goals:0,ast:0,rating:6,i:0,min:0,used:[],cur:null,
     mins:[ri(5,12),ri(20,28),ri(35,43),ri(52,60),ri(66,74),ri(82,88)]};
  const diff=M.myL-M.opL;
  const hint=diff>=5?"Vous êtes favoris.":diff<=-5?"Vous êtes outsiders.":"Le match s'annonce très équilibré.";
  setMain(`<span class="tag">⚽ ${M.title}</span><h2>${M.myN} - ${M.opN}</h2>${board()}
  <p class="txt">${hint} Tes décisions sur le terrain vont faire évoluer le match. Passe, dribble, frappe : à toi de jouer !</p>
  <button class="btn" onclick="nextMoment()">Coup d'envoi ⚽</button>`);
}
function board(){
  return `<div class="board"><div><span>${M.myF}</span><small>${M.myN}</small></div><div class="sc">${M.my} - ${M.op}</div><div><span>${M.opF}</span><small>${M.opN}</small></div></div>
  <p class="mstat">⏱ ${M.min}' · ⚽ ${M.goals} but(s) · 🎯 ${M.ast} passe(s) D · Note ${M.rating.toFixed(1)}/10</p>`;
}
function nextMoment(){
  if(M.i>=6)return endMatch();
  M.min=M.mins[M.i];
  const type=pickType(M.i);M.used.push(type);
  M.cur=SIT[type]();
  let pre="";
  if(M.i===5)pre=M.my>M.op?"Dernières minutes, vous menez : il faut tenir ! ":M.my<M.op?"Dernières minutes, vous êtes menés : il faut tout tenter ! ":"Dernières minutes, le score est nul : un but peut tout changer ! ";
  let h=`<span class="tag">⚽ ${M.title}</span>${board()}<h2>${M.min}'</h2><p class="txt">${pre}${M.cur.text}</p><div class="choices">`;
  M.cur.ch.forEach((c,k)=>{h+=`<button class="choice" data-k="${k}">${c.t}</button>`});
  h+="</div>";setMain(h);
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>playChoice(+b.dataset.k));
}
function playChoice(k){
  const o=M.cur.ch[k].f();
  const lines=[];
  const cls=o.goal||o.my?"goal":(o.op?"bad":"");
  lines.push(`<div class="ln ${cls}">${M.min}' — ${o.msg}</div>`);
  M.my+=o.my;M.op+=o.op;
  if(o.goal)M.goals++;
  if(o.ast)M.ast++;
  M.rating=clamp(M.rating+o.rate,3,10);
  if(o.rep)G.rep=clamp(G.rep+o.rep);
  if(o.counter&&Math.random()<clamp(o.counter+(M.opL-M.myL)/300,.05,.6)){
    M.op++;M.rating=clamp(M.rating-.2,3,10);
    lines.push(`<div class="ln bad">⚠️ Contre-attaque fatale : ${M.opN} marque !</div>`);
  }
  // Évolution du match entre deux situations (autres joueurs)
  if(M.i<5){
    const gm=Math.min(M.min+ri(3,8),89);
    if(Math.random()<clamp(.09+tm()*.5,.02,.22)){M.my++;lines.push(`<div class="ln goal">${gm}' — ⚽ Un de tes coéquipiers marque ! ${M.myN} fait la différence.</div>`)}
    if(Math.random()<clamp(.09-tm()*.5,.02,.22)){M.op++;lines.push(`<div class="ln bad">${gm}' — ⚠️ ${M.opN} marque sur une action collective.</div>`)}
  }
  M.i++;
  if(M.i===3)lines.push(`<div class="ln sys">🔔 Mi-temps : ${M.myN} ${M.my} - ${M.op} ${M.opN}</div>`);
  const last=M.i>=6;
  if(last)lines.push(`<div class="ln sys">🏁 Coup de sifflet final !</div>`);
  setMain(`<span class="tag">⚽ ${M.title}</span>${board()}${lines.join("")}<button class="btn" onclick="${last?"endMatch()":"nextMoment()"}">${last?"Voir le bilan":"Continuer le match"}</button>`);
}
function endMatch(){
  const win=M.my>M.op,draw=M.my===M.op,r=M.rating;
  const b=snap();
  G.sGoals+=M.goals;G.sAssists+=M.ast;
  if(win)G.sWins++;else if(!draw)G.sLosses++;
  G.form=clamp(G.form+(win?3:draw?0:-3)+(r>=7.5?3:r<5.5?-3:0));
  G.rep=clamp(G.rep+(win?(M.big||M.nat?3:1):draw?0:(M.big||M.nat?-2:-1))+(r>=8?2:0));
  if(win)G.money+=G.salary*.01;
  let extra="";
  if(M.big&&win){G.trophies++;G.cupWon=true;G.rep=clamp(G.rep+3);extra=`<div class="ln goal">🏆 Vous remportez la coupe nationale !</div>`}
  if(M.nat&&win)G.fam=clamp(G.fam+2);
  const res=win?"Victoire":draw?"Match nul":"Défaite";
  const a=snap();
  addLog(`${M.title} : ${res} ${M.my}-${M.op} contre ${M.opN} (${M.goals} but(s), ${M.ast} passe(s) D, note ${r.toFixed(1)}).`);
  setMain(`<span class="tag">📋 Bilan du match</span><h2>${win?"🎉 "+res:draw?"🤝 "+res:"😞 "+res}</h2>${board()}${extra}
  <table>
   <tr><td>Tes buts</td><td>${M.goals}</td></tr>
   <tr><td>Tes passes décisives</td><td>${M.ast}</td></tr>
   <tr><td>Ta note</td><td>${r.toFixed(1)} / 10</td></tr>
  </table><div class="chips">${chips(b,a)}</div><button class="btn" id="go">Continuer</button>`);
  $("#go").onclick=proceed;render();
}

/* ============ MERCATO & AGENTS ============ */
function transferWindow(){
  const tgt=G.ovr+ri(-3,7);
  let pool=CLUBS.filter(c=>c.n!==G.club.n).sort((a,b)=>Math.abs(a.l-tgt)-Math.abs(b.l-tgt)).slice(0,6);
  pool=shuffle(pool).slice(0,3);
  G.offers=[{club:G.club,renew:true},...pool.map(c=>({club:c}))].map(o=>{
    o.sal=salaryFor(G.ovr,o.club);
    o.bonus=Math.round(o.sal*(o.renew?.15:.35)/1000)*1000;
    return o;
  });
  renderOffers();
}
function renderOffers(){
  let h=`<span class="tag">💼 Mercato</span><h2>Saison ${G.season} · Offres reçues</h2>
  <p class="txt">Ton agent a reçu des propositions. Tu peux signer tout de suite ou négocier le salaire.</p><div class="offers">`;
  G.offers.forEach((o,i)=>{
    h+=`<div class="offer"><div><b>${o.club.f} ${o.club.n}</b> ${o.renew?'<span class="pill">Prolongation</span>':''}<br>
    <small>Niveau du club : ${o.club.l} · Salaire : <b>${fmt(o.sal)}</b>/an · Prime de signature : ${fmt(o.bonus)}</small></div>
    <div><button class="btn small" onclick="accept(${i},0,'')">Signer</button><button class="btn small alt" onclick="openNego(${i})">Négocier</button></div></div>`;
  });
  h+=`</div><button class="btn ghost" onclick="skipMarket()">Ne rien signer et continuer la saison</button>`;
  setMain(h);
}
function skipMarket(){G.offers=[];proceed()}
function accept(i,comm,pref){
  const o=G.offers[i],old=G.club,b=snap();
  G.salary=o.sal;G.money+=o.bonus-comm;
  let m;
  if(o.renew){m=`Tu prolonges à ${o.club.n} avec un salaire de ${fmt(o.sal)} par an.`;G.form=clamp(G.form+2)}
  else{
    G.club=o.club;G.form=clamp(G.form+6);
    G.rep=clamp(G.rep+Math.max(0,o.club.l-old.l)/4);
    if(o.club.c!==old.c){G.fam=clamp(G.fam-4);if(G.partner)G.couple=clamp(G.couple-5)}
    m=`Tu signes à ${o.club.n} pour ${fmt(o.sal)} par an !`;
  }
  if(comm)m+=` Ton agent prélève ${fmt(comm)} de commission.`;
  addLog(m);const a=snap();G.offers=[];
  showResult(pref+m,chips(b,a),proceed);
}
function negoP(){
  const o=G.offers[NEGO.i],a=AGENTS[NEGO.a],d=DEMANDS[NEGO.d];
  return clamp(.92-d.v*.9+a.s+(G.rep-50)/400+(G.ovr-o.club.l)/120,.05,.95);
}
function openNego(i){NEGO={i,a:1,d:1};renderNego()}
function renderNego(){
  const o=G.offers[NEGO.i];
  let h=`<span class="tag">🤝 Négociation</span><h2>${o.club.f} ${o.club.n}</h2>
  <p class="txt">Offre actuelle : <b>${fmt(o.sal)}</b>/an. Choisis ton agent puis ton exigence. Plus tu demandes, plus le club risque de se retirer.</p>
  <h3>Ton agent</h3><div class="opts">`;
  AGENTS.forEach((a,k)=>h+=`<button class="opt ${NEGO.a===k?"sel":""}" onclick="NEGO.a=${k};renderNego()"><b>${a.n}</b><br><small>${a.d} · commission ${Math.round(a.c*100)} %</small></button>`);
  h+=`</div><h3>Ta demande</h3><div class="opts">`;
  DEMANDS.forEach((d,k)=>h+=`<button class="opt ${NEGO.d===k?"sel":""}" onclick="NEGO.d=${k};renderNego()"><b>${d.l}</b><br><small>${fmt(o.sal*(1+d.v))}/an</small></button>`);
  const p=negoP(),lab=p>.75?"Élevées":p>.5?"Correctes":p>.25?"Faibles":"Quasi nulles";
  h+=`</div><p class="txt">Chances de réussite : <b>${lab}</b></p>
  <button class="btn" onclick="doNego()">Lancer la négociation</button><button class="btn ghost" onclick="renderOffers()">Retour</button>`;
  setMain(h);
}
function doNego(){
  const o=G.offers[NEGO.i],a=AGENTS[NEGO.a],d=DEMANDS[NEGO.d];
  if(Math.random()<negoP()){
    o.sal=Math.round(o.sal*(1+d.v)/1000)*1000;
    o.bonus=Math.round(o.sal*(o.renew?.15:.35)/1000)*1000;
    accept(NEGO.i,Math.round(o.sal*a.c),"🤝 Négociation réussie ! ");
  }else{
    const nom=o.club.n;G.offers.splice(NEGO.i,1);G.rep=clamp(G.rep-1);
    addLog(`${nom} retire son offre après ta demande trop élevée.`);
    showResult(`${nom} juge tes exigences excessives et retire son offre.`,`<span class="chip down">Réputation -1</span>`,
      ()=>G.offers.length?renderOffers():skipMarket());
  }
}

/* ============ FIN DE SAISON ============ */
function endSeason(){
  const c=G.club,s=G.season,b=snap(),ovrAvant=Math.round(G.ovr);
  const pt=clamp((G.ovr-(c.l-12))/12,.2,1);
  const net=G.salary*.55,cost=40000+G.salary*.05*(1+G.kids*.3+(G.partner?.3:0));
  G.money+=net-cost;
  const simGoals=Math.round(pt*((G.ovr-40)/50)*GOALF[G.pos]*rnd(.5,1.2)*.8);
  const goals=simGoals+G.sGoals;
  const assists=G.sAssists+Math.round(pt*rnd(2,7));
  const tp=clamp(clamp((c.l-62)/40,0,.6)*(.5+pt*.5)+G.sWins*.03-G.sLosses*.02,0,.75);
  const titles=[];
  if(Math.random()<tp)titles.push("Championnat");
  if(c.l>=80&&Math.random()<tp*.4)titles.push("Ligue des champions");
  G.trophies+=titles.length;
  const allTitles=[...titles,...(G.cupWon?["Coupe nationale"]:[])];
  let ballon=false;
  if(G.ovr>=84&&G.rep>=75){ballon=Math.random()<clamp((G.ovr-84)/14+(allTitles.length?.2:0)+goals/120,.05,.7);}
  if(ballon)G.ballons++;
  const base=G.age<=20?3.2:G.age<=23?2.2:G.age<=27?.8:G.age<=30?-.3:G.age<=33?-1.5:-2.5;
  let d=base*(.6+.4*pt)+(G.form-55)/50+rnd(-.7,.7);
  if(G.ovr>=G.pot&&d>0)d*=.3;
  G.ovr=clamp(G.ovr+d,40,99);G.peak=Math.max(G.peak,Math.round(G.ovr));
  const target=clamp(G.ovr+goals/3+allTitles.length*5+(ballon?8:0)-6,0,100);
  G.rep=clamp(G.rep+(target-G.rep)*.3+(ballon?4:0));
  G.form=clamp(G.form+(70-G.form)*.5);
  if(G.partner)G.couple=clamp(G.couple-3);
  G.fam=clamp(G.fam-2);
  const extra=[];
  if(G.partner==="marié"&&G.couple<=10){
    const loss=Math.max(0,G.money)*.35+G.salary*.2;G.money-=loss;G.partner=null;G.couple=0;G.fam=clamp(G.fam-15);
    extra.push(`💔 Divorce : tu perds ${fmt(loss)} et ta famille en souffre.`);
  }else if(G.partner==="couple"&&G.couple<=10){
    G.partner=null;G.couple=0;extra.push("💔 Ta relation s'est terminée.");
  }
  if(!G.summit&&Math.round(G.ovr)>=90&&G.rep>=90){G.summit=true;extra.push("🏔️ Tu as atteint le sommet du football mondial !");}
  if(ballon)extra.push("🥇 Tu remportes le Ballon d'Or !");
  const wins=G.sWins,losses=G.sLosses;
  G.sGoals=0;G.sAssists=0;G.sWins=0;G.sLosses=0;G.cupWon=false;
  G.age++;G.season++;
  const a=snap();
  G.hist.push(`Saison ${s} (${c.n}) : ${goals} buts${allTitles.length?", "+allTitles.join(", "):""}${ballon?", Ballon d'Or":""}`);
  addLog(`Fin de saison : ${goals} buts, ${allTitles.length} titre(s).`);
  let h=`<span class="tag">📅 Bilan</span><h2>Fin de la saison ${s}</h2>
  <table>
   <tr><td>Club</td><td>${c.f} ${c.n}</td></tr>
   <tr><td>Temps de jeu</td><td>${pt>.8?"Titulaire indiscutable":pt>.5?"Titulaire":"Remplaçant"}</td></tr>
   <tr><td>Matchs joués (victoires / défaites)</td><td>${wins} V · ${losses} D</td></tr>
   <tr><td>Buts</td><td>${goals}</td></tr>
   <tr><td>Passes décisives</td><td>${assists}</td></tr>
   <tr><td>Trophées</td><td>${allTitles.length?allTitles.join(", "):"Aucun"}</td></tr>
   <tr><td>Niveau</td><td>${ovrAvant} → ${Math.round(G.ovr)}</td></tr>
   <tr><td>Revenu net de l'année</td><td>${fmt(net-cost)}</td></tr>
  </table>`;
  if(extra.length)h+=`<p class="txt">${extra.join("<br>")}</p>`;
  h+=`<div class="chips">${chips(b,a)}</div>`;
  const fin=G.form<=0||G.money<-2e6||G.ovr<=46||G.age>=39;
  if(fin){
    h+=`<button class="btn" onclick="finish(G.form<=0?'blessure':G.money<-2e6?'ruine':'retraite')">Voir ma fin de carrière</button>`;
  }else{
    h+=`<button class="btn" onclick="beginSeason()">Saison suivante ▶</button>`;
    if(G.age>=33)h+=`<button class="btn ghost" onclick="finish('retraite')">Prendre ma retraite</button>`;
  }
  setMain(h);render();
}

/* ============ FIN DE CARRIÈRE ============ */
function finish(reason){
  try{localStorage.removeItem("fl_save")}catch(e){}
  const score=Math.round(G.peak*3+G.trophies*8+G.ballons*35+G.rep+G.fam/2+(G.partner?G.couple/2:0)+Math.max(0,G.money)/2e6);
  const verdict=score>=650?"Légende absolue 👑":score>=480?"Superstar mondiale ⭐":score>=350?"Grand joueur 🔥":score>=250?"Bonne carrière 👍":"Carrière modeste";
  const motif={retraite:"Tu raccroches les crampons.",blessure:"Une blessure met brutalement fin à ta carrière.",ruine:"Tes dettes t'obligent à tout arrêter."}[reason];
  setMain(`<span class="tag">🏁 Fin de carrière</span>
  <h2>${G.name} ${G.flag}</h2><p class="txt">${motif}</p>
  <p class="big-title">${verdict}</p>
  <table>
   <tr><td>Score final</td><td>${score}</td></tr>
   <tr><td>Meilleur niveau</td><td>${G.peak}</td></tr>
   <tr><td>Trophées</td><td>🏆 ${G.trophies}</td></tr>
   <tr><td>Ballons d'Or</td><td>🥇 ${G.ballons}</td></tr>
   <tr><td>Fortune</td><td>${fmt(G.money)}</td></tr>
   <tr><td>Vie de famille</td><td>${G.partner?(G.partner==="marié"?"Marié":"En couple"):"Célibataire"}${G.kids?` · ${G.kids} enfant(s)`:""}</td></tr>
   <tr><td>Sommet atteint</td><td>${G.summit?"Oui 🏔️":"Non"}</td></tr>
  </table>
  <button class="btn" onclick="location.reload()">Rejouer avec un autre joueur</button>`);
  render();
}

buildStart();
</script>
